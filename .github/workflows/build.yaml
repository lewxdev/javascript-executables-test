name: Build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25.6.1

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: sea-${{ matrix.os }}
          path: .sea/
          if-no-files-found: error
