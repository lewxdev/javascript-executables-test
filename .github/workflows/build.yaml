name: Build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-node:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node/

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25.6.1

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: node-${{ matrix.os }}
          path: node/dist/
          if-no-files-found: error
